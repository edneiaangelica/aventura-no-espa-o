<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perdidos no Espaço</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>🚀 Perdidos no Espaço</h1>
        <p>
          Cadetes da Academia Estelar, a nave foi desviada por uma nebulosa! Resolva os desafios para restaurar os sistemas e voltar à missão.
        </p>
      </header>

      <section class="hud">
        <div>
          <label for="energy-progress">🔋 Energia da nave</label>
          <progress id="energy-progress" max="100" value="0"></progress>
        </div>
        <div>
          <label for="fuel-progress">⛽ Combustível</label>
          <progress id="fuel-progress" max="100" value="0"></progress>
        </div>
      </section>

      <section class="status">
        <span id="mission-label">Missão: Nível 1 – Energia da nave</span>
        <span id="timer">⏱️ 01:00</span>
      </section>

      <section class="card" id="challenge-card">
        <h2 id="question-title">Prepare-se para o desafio!</h2>
        <p id="question-text"></p>
        <form id="answer-form">
          <input
            id="answer-input"
            type="text"
            autocomplete="off"
            inputmode="numeric"
            aria-label="Resposta do desafio"
            required
          />
          <button type="submit">Enviar resposta</button>
        </form>
        <p class="hint" id="question-hint"></p>
      </section>

      <section class="feedback hidden" id="feedback-screen" aria-live="polite" aria-atomic="true"></section>

      <section class="controls">
        <button id="start-button">Iniciar missão</button>
        <button id="retry-button" class="hidden">Tentar novamente</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
